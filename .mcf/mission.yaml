      - "contrato da missão"
  - sequence: 2
    agent: Leonardo
    activity: "Separar intenção, problema, objetivo, solução candidata e aceite"
    evidence:
      - "onboarding/ONBOARDING-START.md"
  - sequence: 3
    agent: Miriam
    activity: "Definir contexto transportável e handoff estruturado"
    evidence:
      - "contrato YAML embutido no onboarding"
  - sequence: 4
    agent: Beatriz
    activity: "Avaliar cenários de comportamento e detectar dependência de schema externo"
    evidence:
      - "onboarding/ONBOARDING-TEST-SCENARIOS.md"
      - "correção para ONBOARDING-START.md autocontido"
  - sequence: 5
    agent: Augusto
    activity: "Registrar rastreabilidade e separar validação estática de teste real"
    evidence:
      - "artifacts/phases/PHASE-01-DISCOVERY-ONBOARDING/"
  - sequence: 6
    agent: Júlia
    activity: "Revisar autonomia, confirmação e limites de coleta"
    evidence:
      - "regras de autonomia e privacidade no prompt"
  - sequence: 7
    agent: Léo
    activity: "Gate operacional da fase"
    evidence:
      - "validação estática PASS"
      - "live interview PENDING"

phase_result:
  phase_state: ENTREGUE
  canonical_artifact: onboarding/ONBOARDING-START.md
  static_validation: PASS
  yaml_smoke: PASS
  live_interview_behavior: PENDING
  discovered_failure: "Primeira iteração dependia de schema externo não disponível automaticamente no chat do André."
  recovery: "Criado ONBOARDING-START.md autocontido e README atualizado para apontá-lo como entrada canônica."

leo_gate:
  decision: APROVAR_COM_RESSALVAS
  justification: "O protocolo e o handoff passaram validação estrutural; o comportamento em conversa real só pode ser avaliado após a entrevista."
  next_state: AGUARDANDO_DEPENDENCIA_EXTERNA
  escalate_to_leandro: false

next_handoff:
  required_input: onboarding_result_yaml
  source: "entrevista de André usando onboarding/ONBOARDING-START.md"
  return_to: Mestre
  acceptance_for_return:
    - "status explicitamente registrado"
    - "CONFIRMED somente sem contradição material aberta"
    - "CONFIRMED somente com confirmação explícita"
  next_action: "Retomar com MCF-DEFINE-PRODUCT após receber o YAML."
